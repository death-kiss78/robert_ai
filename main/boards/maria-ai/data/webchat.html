<!DOCTYPE html>
<html>
<head>
  <title>WebChat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="img/webchat.svg">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

<div align="center">
  <img src="img/xiao.jpg" width="70%"><br>
</div>

<div class="container" align="center">

  <h1>WebChat</h1>

  <!-- CHAT WINDOW -->
  <div id="chat-window" class="chat-window">
      <div id="chat-messages" class="chat-messages"></div>
  </div>

  <!-- INPUT AREA -->
  <div class="chat-input-area">
      <input id="chat_input" type="text" placeholder="Scrie un mesaj..." class="chat-input">
      <button onclick="sendText()" class="chat-send-btn">
          <span class="material-icons">send</span>
      </button>
  </div>

  <div class='arm-block'>
      <span>Powered by &copy; DeaTh KiSS part of AV3NTURA&trade;</span>
  </div>

</div>

<br>

<div align="center">
    <img src="img/home.svg" width="40"> 
    <button onclick="location.href='index.html'">Home</button>
</div>

<script>
/************************************************************
 *  CHAT UI
 ************************************************************/
function addMessage(sender, text) {
    const box = document.getElementById("chat-messages");

    const bubble = document.createElement("div");
    bubble.className = sender === "Xiao" ? "bubble bubble-xiao" : "bubble bubble-user";
    bubble.innerText = sender + ": " + text;

    box.appendChild(bubble);
    box.scrollTop = box.scrollHeight;
}

/************************************************************
 *  SEND TEXT TO ESP32 (HTTP POST /chat)
 ************************************************************/
function sendText() {
    const msg = document.getElementById("chat_input").value.trim();
    if (!msg) return;

    addMessage("Tu", msg);

    fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: msg })
    })
    .then(r => r.json())
    .then(j => {
        addMessage("Xiao", j.reply);
    })
    .catch(err => {
        addMessage("System", "Eroare la comunicarea cu dispozitivul.");
        console.error(err);
    });

    document.getElementById("chat_input").value = "";
}

</script>

<button class="refresh-btn" onclick="location.reload()">&#128260;</button>
<button style="width:42px;" class="reset-sticky" onclick="resetAndReload()">&#128260; RST</button>

</body>
</html>
